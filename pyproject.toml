[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "beacon-lens"
version = "0.1.0"
description = "Explainable beacon and DNS-encoding triage for Zeek JSON logs."
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
beacon-lens = "beacon_lens:main"

[tool.setuptools]
py-modules = ["beacon_lens"]
package-dir = {"" = "src"}
